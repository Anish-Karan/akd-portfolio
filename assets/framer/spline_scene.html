			#hints {

				left: 0;

				height: 100%;
				display: none;
				align-items: center;
				justify-content: center;
				pointer-events: none;

				animation-duration: 4s;
				animation-name: slidein;
				animation-iteration-count: infinite;
				animation-timing-function: ease-in-out;
			}

			@keyframes slidein {
				from {
					transform: translateX(0px);
					opacity: 0;
				}
				50% {
					opacity: 0;
					transform: translateX(0px);
				}
				60% {
					opacity: 1;
				}
				65% {
					transform: translateX(-30px);
				}
				85% {
					transform: translateX(30px);
				}
				90% {
					opacity: 1;
				}
				to {
					opacity: 0;
					transform: translateX(0px);
				}
			}
			#preloader {
				position: absolute;
				display: flex;
				top: 0;
				left: 0;
				align-items: center;
				justify-content: center;
				width: 100%;
				height: 100%;
				z-index: 3;
			}

				0% {
					transform: rotate(0deg);
				}
				100% {
